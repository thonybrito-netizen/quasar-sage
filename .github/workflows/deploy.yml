name: Deploy Gateway to GCP Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "app/**"
      - ".github/workflows/deploy.yml"

env:
  PROJECT_ID: quasar-business-sage
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPO: quasar-sage
  SERVICE: quasar-sage-gateway
  APP_SERVICE: quasar-sage-app
  WIF_PROVIDER: projects/250103471198/locations/global/workloadIdentityPools/quasar-sage-github-pool/providers/quasar-sage-github-provider
  WIF_SA: quasar-sage-github-actions@quasar-business-sage.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Gateway image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/gateway:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/gateway:latest \
            gateway

      - name: Push Gateway image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/gateway:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/gateway:latest

      # --allow-unauthenticated at the Cloud Run ingress layer, same as
      # QuietNoise's own quietnoise-api service (cloudbuild.yaml): callers
      # are external services (QuietNoise's Next.js server, Lorito's
      # FastAPI backend) sending a plain `Authorization: Bearer <tenant
      # key>` header, not a Google-signed ID token, so IAM-level auth
      # would reject them before the request ever reached the app's own
      # tenant-key check in core/security.py. Real auth is that app-level
      # check; Cloud Run ingress is deliberately open, exactly like
      # quietnoise-api.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/gateway:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=10 \
            --memory=512Mi \
            --set-env-vars="CHAT_MODEL_ID=claude-sonnet-5,CORS_ALLOW_ORIGINS=*" \
            --set-secrets="ANTHROPIC_API_KEY=anthropic-api-key:latest,TENANT_API_KEYS=quasar-sage-tenant-keys:latest"

      - name: Get Gateway URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)"

      # ---- Standalone app (Quasar Sage's own product surface) ----
      - name: Build App image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/app:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/app:latest \
            app

      - name: Push App image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/app:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/app:latest

      - name: Deploy App to Cloud Run
        run: |
          gcloud run deploy ${{ env.APP_SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/app:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=5 \
            --memory=512Mi \
            --set-env-vars="SAGE_GATEWAY_URL=https://quasar-sage-gateway-lnexpzgv5a-uc.a.run.app" \
            --set-secrets="SAGE_DEMO_TENANT_KEY=sage-demo-tenant-key:latest"

      - name: Get App URL
        run: |
          gcloud run services describe ${{ env.APP_SERVICE }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)"
